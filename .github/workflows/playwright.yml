name: Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Install Playwright Browsers & OS Dependencies
      run: npx playwright install --with-deps
      
    - name: Install Electron OS dependencies
      # npx playwright install --with-deps installs deps for Playwright's own
      # browsers (Chromium/Firefox/WebKit) but NOT for Electron's bundled Chromium.
      # Electron 29 requires these additional system libraries.
      run: |
        sudo apt-get update -q
        sudo apt-get install -y \
          libgbm1 \
          libglib2.0-0 \
          libnss3 \
          libnspr4 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2t64 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libasound2t64 \
          libpango-1.0-0 \
          libpangocairo-1.0-0 \
          libdbus-1-3 \
          xvfb
      
    - name: Fix bin permissions
      run: chmod -R +x node_modules/.bin/
      
    - name: Build Vite app
      run: npm run build
      
    - name: Test Electron Launch
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node test-launch.cjs
      env:
        CI: 'true'
        ELECTRON_DISABLE_SANDBOX: '1'
        ELECTRON_ENABLE_LOGGING: '1'

    # Note: Since the tests launch an Electron app, they require a display server. 
    # xvfb-run provides a virtual X11 display for Electron.
    - name: Run Playwright tests
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:deep
      env:
        ELECTRON_DISABLE_SANDBOX: '1'
        ELECTRON_ENABLE_LOGGING: '1'
      
    - name: Upload Test Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
        
    - name: Upload Test Results (Traces)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 14
