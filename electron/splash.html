<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ZeInfoTech POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 480px;
      height: 300px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #dadce0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.15);
    }
    .logo {
      width: 72px;
      height: 72px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #202124;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 12px;
      color: #5f6368;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .loader {
      width: 200px;
      height: 4px;
      background: #f1f3f4;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #1a73e8, #34a853);
      border-radius: 4px;
      animation: slide 1.5s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(600%); }
    }
    .status {
      font-size: 11px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="18 8 208 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="paperBlendG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#FDFEFF"/>
          <stop offset="0.6" stop-color="#F1F4FE"/>
          <stop offset="1" stop-color="#D9E1F9"/>
        </linearGradient>
      </defs>
      <path d="M32 46 C 32 32, 42 22, 56 22 L 188 22 C 202 22, 212 32, 212 46 L 212 214 L 201 201 L 190 214 L 179 201 L 168 214 L 157 201 L 146 214 L 135 201 L 124 214 L 113 201 L 102 214 L 91 201 L 80 214 L 69 201 L 58 214 L 47 201 L 32 214 Z" fill="url(#paperBlendG)"/>
      <g transform="translate(92.8,88) scale(0.6) translate(-182,-164)">
        <path d="M136 108 C 130 108, 126 112, 126 118 C 126 124, 130 128, 136 128 L 202 128 C 190 140, 168 158, 148 176 C 132 190, 124 198, 124 210 C 124 216, 128 220, 134 220 L 226 220 C 232 220, 236 216, 236 210 C 236 204, 232 200, 226 200 L 160 200 C 172 188, 194 170, 214 152 C 230 138, 238 130, 238 118 C 238 112, 234 108, 228 108 Z" fill="#26339E" stroke="#26339E" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <rect x="58" y="146" width="128" height="10" rx="5" fill="#9AA3EF"/>
      <rect x="58" y="162" width="98" height="10" rx="5" fill="#C4CAF6"/>
      <rect x="58" y="178" width="112" height="10" rx="5" fill="#9AA3EF"/>
    </svg>
    <div>
      <div class="title">ZeInfoTech POS</div>
      <div class="subtitle" style="text-align:center;margin-top:4px">Point of Sale System</div>
    </div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="status">Starting sync server...</div>
  </div>
</body>
</html>
